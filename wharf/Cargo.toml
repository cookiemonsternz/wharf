[package]
name = "wharf"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
log = "0.4.33"
pretty_env_logger = "0.5.0"
winit = "0.30.13"
wharf-macros.workspace = true
vulkano = "0.35.2"

[dependencies.uuid]
version = "1.24.0"
features = ["v4"]

[features]
default = ["winit"]
winit = []

[profile.dev]
opt-level = 1
